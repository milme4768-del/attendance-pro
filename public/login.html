<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In · ShiftLog</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="centered-page">
    <div class="login-card">
      <div class="logo">
        <div class="dot">⏱</div>
        <strong>SHIFTLOG</strong>
      </div>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your account to continue</p>

      <form id="login-form">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@company.com" required autocomplete="username" autofocus />
          <span class="error-text"></span>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
          <span class="error-text"></span>
        </div>

        <button type="submit" class="btn btn-primary" id="login-btn">
          <span class="btn-text">Sign In</span>
          <span class="spinner" style="display:none; width:20px; height:20px; border-width:2px;"></span>
        </button>
      </form>

      <div id="msg"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
