<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4f6ef7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.svg" />
<title>Sign In · ShiftLog</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">⏱</div>
        <strong>SHIFTLOG</strong>
      </div>
      <h1>Welcome back</h1>
      <p class="login-sub">Sign in to your account</p>

      <form id="login-form">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" class="input-field" id="email" placeholder="you@company.com" required autocomplete="username" autofocus />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" class="input-field" id="password" placeholder="Enter password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">
          <span class="btn-text">Sign In</span>
          <span class="spinner" style="display:none; width:20px; height:20px; border-width:2px;"></span>
        </button>
      </form>
      <div id="msg"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
