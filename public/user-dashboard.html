<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4f6ef7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.svg" />
<title>ShiftLog</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="toast-container" class="toast-container"></div>
  <div class="app-shell">
    <div class="status-bar"></div>
    <header class="app-header">
      <div class="header-left">
        <div class="header-logo">⏱</div>
        <div><div class="header-title">ShiftLog</div><div class="header-sub" id="header-user">Staff</div></div>
      </div>
      <div class="header-right">
        <button class="header-btn" id="logout-btn" title="Sign out">🚪</button>
      </div>
    </header>
    <div class="page-container" id="page-container">
      <div class="page active" id="page-dashboard">
        <div class="checkin-card">
          <span class="checkin-icon" id="status-icon">⏳</span>
          <div class="checkin-time" id="live-clock">--:--:--</div>
          <div class="checkin-date" id="live-date">Loading...</div>
          <div class="checkin-status" id="status-text">Checking...</div>
          <div class="checkin-sub" id="status-sub">Please wait</div>
          <div class="checkin-location" id="location-status">📍 Detecting...</div>
          <button class="btn btn-lg btn-success" id="checkin-btn" style="display:none;">✅ Check In</button>
          <button class="btn btn-lg btn-danger" id="checkout-btn" style="display:none;">🚪 Check Out</button>
        </div>

        <div id="camera-area" style="display:none;">
          <div class="camera-card">
            <video id="camera-preview" autoplay playsinline></video>
            <img id="captured-photo" style="display:none;" />
            <div class="camera-overlay" id="capture-overlay">
              <button class="camera-btn" id="capture-btn"><div class="inner"></div></button>
            </div>
          </div>
          <div class="capture-actions" id="capture-actions" style="display:none;">
            <button class="btn btn-success btn-sm" id="confirm-photo" style="flex:1;">✅ Confirm</button>
            <button class="btn btn-outline btn-sm" id="retake-photo" style="flex:1;">🔄 Retake</button>
            <button class="btn btn-outline btn-sm" id="cancel-camera">✕ Cancel</button>
          </div>
          <div id="camera-status"></div>
        </div>

        <div id="checkin-msg"></div>
        <div class="section-title" style="margin-top:8px;">History</div>
        <div class="card">
          <div class="card-header"><h2>Recent Records</h2><span class="card-badge" id="history-count">0</span></div>
          <div id="history-list"><div class="loading"><div class="spinner"></div><span>Loading...</span></div></div>
        </div>
      </div>
    </div>
    <nav class="bottom-nav">
      <button class="nav-tab active"><span class="nav-icon">🏠</span><span>Dashboard</span></button>
    </nav>
    <aside class="desktop-sidebar">
      <div class="sb-logo"><div class="sb-icon">⏱</div><strong>SHIFTLOG</strong></div>
      <div class="sb-user"><div class="sb-name" id="desktop-user-name">—</div><div class="sb-role" id="desktop-user-role">Staff</div></div>
      <button class="sb-nav active"><span class="sb-nav-icon">🏠</span> Dashboard</button>
      <div class="sb-spacer"></div>
      <button class="sb-nav sb-logout" id="desktop-logout"><span class="sb-nav-icon">🚪</span> Sign Out</button>
    </aside>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/user-dashboard.js"></script>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
  </script>
</body>
</html>
