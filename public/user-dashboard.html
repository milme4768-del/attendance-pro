<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard · ShiftLog</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="toast-container" class="toast-container"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <div class="dot">⏱</div>
        <strong>SHIFTLOG</strong>
      </div>
      <div class="user-badge">
        <div class="name" id="user-name">—</div>
        <div class="role" id="user-role">Staff</div>
      </div>
      <button class="nav-item active" data-tab="dashboard">
        <span class="icon">📊</span> Dashboard
      </button>
      <button class="nav-item" data-tab="history">
        <span class="icon">📋</span> History
      </button>
      <div class="spacer"></div>
      <button class="nav-item logout" id="logout-btn">
        <span class="icon">🚪</span> Sign Out
      </button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <button class="hamburger" id="hamburger">☰</button>

      <!-- Dashboard Tab -->
      <div class="tab-content active" id="tab-dashboard">
        <div class="page-header">
          <div>
            <h1>My Dashboard</h1>
            <p>Track your attendance and manage your shifts</p>
          </div>
        </div>

        <div class="card checkin-area">
          <div class="status-icon" id="status-icon">⏳</div>
          <div class="time-display" id="live-clock">--:--:--</div>
          <div class="date-display" id="live-date">Loading...</div>
          <div class="status-text" id="status-text">Checking status...</div>
          <div class="status-sub" id="status-sub">Please wait while we load your data</div>
          <div class="location-status" id="location-status">
            <span>📍</span> Detecting your location...
          </div>
          <button class="btn btn-primary btn-lg" id="checkin-btn" style="display:none;">
            ✅ Check In
          </button>
          <button class="btn btn-danger btn-lg" id="checkout-btn" style="display:none;">
            🚪 Check Out
          </button>
          <div id="photo-preview" style="display:none;margin-top:16px;">
            <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">📸 Photo captured:</div>
            <img id="photo-preview-img" style="max-width:240px;border-radius:var(--radius-md);border:2px solid var(--glass-border);" />
            <div style="margin-top:8px;display:flex;gap:8px;justify-content:center;">
              <button class="btn btn-success btn-sm" id="confirm-photo">✅ Confirm & Submit</button>
              <button class="btn btn-outline btn-sm" id="retake-photo">🔄 Retake</button>
            </div>
          </div>
          <div id="checkin-msg"></div>
        </div>
      </div>

      <!-- History Tab -->
      <div class="tab-content" id="tab-history">
        <div class="page-header">
          <div>
            <h1>Attendance History</h1>
            <p>Your recent attendance records</p>
          </div>
        </div>
        <div class="card">
          <div class="card-header">
            <h2>Recent Records</h2>
            <span class="badge" id="history-count">0</span>
          </div>
          <div id="history-list" class="history-list">
            <div class="loading">
              <div class="spinner"></div>
              <span style="margin-left:12px;">Loading records...</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/user-dashboard.js"></script>
</body>
</html>
